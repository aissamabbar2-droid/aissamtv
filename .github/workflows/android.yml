# يبني تطبيق الأندرويد (APK) تلقائياً وينشره في صفحة Releases
# رابط التحميل الثابت: https://github.com/aissamabbar2-droid/aissamtv/releases/latest/download/OpenTV.apk
name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk OpenTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OpenTV-apk
          path: OpenTV.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: تطبيق الأندرويد — تلفزيون مفتوح
          body: |
            ثبّت هذا الملف على هاتف الأندرويد لتشغيل كل الميزات، بما فيها قوائم IPTV التي يمنعها المتصفح.
            عند التثبيت قد يطلب الهاتف السماح بـ«تثبيت تطبيقات من مصادر غير معروفة» لمتصفحك أو لمدير الملفات.
          files: OpenTV.apk
          make_latest: true
